[profile.default]
src = 'contracts'
out = 'out'
libs = ['lib']
fs_permissions = [
    { access = "read-write", path = "deployments" },
    { access = "read-write", path = "./" }
]
ffi = true
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Style lints this codebase deliberately does not follow:
# - mixed-case-*, pascal-case-struct: names that mirror external ABIs (CCIP `EVM2AnyMessage`, Hedera `ECDSA_secp256k1`).
# - screaming-snake-case-immutable: public immutables are part of the read API (`ccipRouter()`, `claimAmount()`).
# - unwrapped-modifier-logic, asm-keccak256: code-size/gas micro-optimisations traded for readability.
# - block-timestamp: governance is time-based by design (voting windows, timelock, expiries), and on
#   Hedera the timestamp comes from hashgraph consensus rather than a single block producer.
# - reentrancy-events: every flagged event reports the outcome of a call it must follow, made to a
#   Hedera system contract, the CCIP router, the DAO's own account clone or `this`. Entry points that
#   reach arbitrary targets are router-only and, on the remote side, guarded by ReentrancyGuardTransient.
[lint]
exclude_lints = [
    "mixed-case-variable",
    "mixed-case-function",
    "pascal-case-struct",
    "screaming-snake-case-immutable",
    "unwrapped-modifier-logic",
    "asm-keccak256",
    "block-timestamp",
    "reentrancy-events",
]

[rpc_endpoints]
localhost = "http://127.0.0.1:8545"
hedera_testnet = "https://testnet.hashio.io/api"
hedera_mainnet = "https://mainnet.hashio.io/api"

# Hedera is now supported on the main Sourcify instance (sourcify.dev).
# Use: forge verify-contract <ADDRESS> <CONTRACT> --chain-id 296 --verifier sourcify
# See: https://hedera.com/blog/smart-contract-verification-sourcify-dev-now-supported
[etherscan]
hedera_testnet = { key = "", url = "https://hashscan.io/testnet" }
hedera_mainnet = { key = "", url = "https://hashscan.io/mainnet" }

[fmt]
line_length = 120
tab_width = 4
quote_style = "double"
bracket_spacing = true
int_types = "long"

# See more config options https://book.getfoundry.sh/reference/config/overview
