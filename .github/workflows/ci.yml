name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Solidity lint, warnings are errors
        working-directory: packages/foundry
        run: forge lint --deny warnings

      - name: Type-check frontend
        run: npm run next:check-types

      - name: Contract tests
        run: npm run test

      - name: Build
        run: npm run build
