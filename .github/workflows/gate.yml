name: Template gate

# Reproduces what a judge or new developer does: scaffold this commit with the real CLI, then install,
# lint, test, build, boot the app and request every route.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fresh-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Git identity for the CLI's initial commit
        run: |
          git config --global user.name "template-gate"
          git config --global user.email "template-gate@users.noreply.github.com"

      - name: Scaffold this commit with create-scaffold-hbar
        # No --skip-install: the CLI installs dependencies its own way (npm install --legacy-peer-deps), which is
        # what a developer gets. A dependency that only arrives through a peer, as `ws` once did, fails here.
        run: |
          npx --yes create-scaffold-hbar@latest gate-app \
            --template "${{ github.repository }}#${{ github.sha }}" \
            --package-manager "npm" --network testnet --yes --skip-hedera-skills
          test -f gate-app/package.json
          test ! -f gate-app/template.json # the CLI consumes the manifest
          test -f gate-app/packages/foundry/.env.example

      - uses: actions/checkout@v4
        with:
          path: source

      - name: Files reach the developer unchanged
        # Scaffolding with npm, the CLI rewrites text files (other package managers' commands, and every "npm <word>").
        # Everything is written so that nothing matches; this fails if any scaffolded file differs from the
        # source, apart from the files the CLI is meant to change.
        run: |
          status=0
          while IFS= read -r file; do
            case "$file" in
              # package.json files and the manifest are the CLI's to change; its own install (with
              # --legacy-peer-deps) rewrites the lockfile.
              package.json|*/package.json|package-lock.json|template.json|.gitmodules|packages/foundry/lib/*) continue ;;
            esac
            [ -L "source/$file" ] && continue
            if ! cmp -s "source/$file" "gate-app/$file"; then
              echo "::error file=$file::create-scaffold-hbar changed this file"
              diff -u "source/$file" "gate-app/$file" | head -40 || true
              status=1
            fi
          done < <(cd source && git ls-files)
          exit $status

      - name: Lint
        working-directory: gate-app
        run: npm run lint

      - name: Contract tests
        working-directory: gate-app
        run: npm run test

      - name: Build
        working-directory: gate-app
        run: npm run build

      - name: Boot and request every route
        working-directory: gate-app
        run: |
          npm run next:serve -- -p 3100 > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3100/ && break; sleep 1; done
          for route in / /proposals/new /voting-power /proposals/1 /debug /api/health; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3100$route")
            echo "$route -> $code"
            test "$code" = "200"
          done

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the full history with gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar xz gitleaks
          ./gitleaks git . --redact --no-banner
